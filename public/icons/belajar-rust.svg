<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0522f"/>
      <stop offset="100%" stop-color="#b8391c"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Gear ring (Rust-inspired cog silhouette) -->
  <g stroke="white" stroke-width="1.6" fill="none" opacity="0.55">
    <circle cx="16" cy="16" r="10.5"/>
    <g stroke-linecap="round">
      <line x1="16" y1="3.6" x2="16" y2="6.2"/>
      <line x1="16" y1="25.8" x2="16" y2="28.4"/>
      <line x1="3.6" y1="16" x2="6.2" y2="16"/>
      <line x1="25.8" y1="16" x2="28.4" y2="16"/>
      <line x1="6.55" y1="6.55" x2="8.4" y2="8.4"/>
      <line x1="23.6" y1="23.6" x2="25.45" y2="25.45"/>
      <line x1="25.45" y1="6.55" x2="23.6" y2="8.4"/>
      <line x1="8.4" y1="23.6" x2="6.55" y2="25.45"/>
    </g>
  </g>

  <!-- R monogram -->
  <text x="16" y="21.5" text-anchor="middle" font-family="monospace" font-weight="700" font-size="15" fill="white">R</text>
</svg>
