<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.06"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <g stroke="#4f46e5" stroke-width="1" opacity="0.15">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glow blobs -->
  <ellipse cx="1050" cy="150" rx="320" ry="220" fill="url(#glow)"/>
  <ellipse cx="150" cy="520" rx="240" ry="160" fill="url(#glow)"/>

  <!-- Right panel: family of 5 languages -->
  <rect x="660" y="120" width="480" height="340" rx="12" fill="#1e293b" opacity="0.9"/>

  <text x="690" y="172" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" fill="white">5 Bahasa Pemrograman</text>
  <text x="690" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">Satu portal, kurikulum berbeda-beda</text>

  <!-- language badges -->
  <g>
    <rect x="681" y="252" width="70" height="70" rx="14" fill="#1E3A9E"/>
    <text x="716" y="294" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="white" text-anchor="middle">C++</text>
    <text x="716" y="342" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">C++</text>
  </g>
  <g>
    <rect x="773" y="252" width="70" height="70" rx="14" fill="#1F4E8C"/>
    <text x="808" y="294" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="white" text-anchor="middle">Py</text>
    <text x="808" y="342" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Python</text>
  </g>
  <g>
    <rect x="865" y="252" width="70" height="70" rx="14" fill="#1D4ED8"/>
    <text x="900" y="294" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="white" text-anchor="middle">SQL</text>
    <text x="900" y="342" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">SQL</text>
  </g>
  <g>
    <rect x="957" y="252" width="70" height="70" rx="14" fill="#0891B2"/>
    <text x="992" y="294" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="white" text-anchor="middle">Go</text>
    <text x="992" y="342" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Golang</text>
  </g>
  <g>
    <rect x="1049" y="252" width="70" height="70" rx="14" fill="#B8391C"/>
    <text x="1084" y="294" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="white" text-anchor="middle">Rs</text>
    <text x="1084" y="342" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Rust</text>
  </g>

  <text x="690" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">+ bahasa lain menyusul</text>

  <!-- Left side: branding -->
  <!-- Logo / icon (monogram D) -->
  <rect x="80" y="160" width="72" height="72" rx="16" fill="url(#accent)" opacity="0.9"/>
  <g transform="translate(80,160) scale(0.140625)">
    <path d="M172,120 L172,392 L268,392 C356,392 400,332 400,256 C400,180 356,120 268,120 Z
             M232,176 L268,176 C324,176 344,212 344,256 C344,300 324,336 268,336 L232,336 Z"
          fill="white" fill-rule="evenodd"/>
    <rect x="200" y="416" width="112" height="14" rx="7" fill="#FBBF24"/>
  </g>

  <!-- Title -->
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="64" fill="white">disinauni</text>

  <!-- Tagline -->
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8">Portal belajar coding gratis &amp; interaktif</text>
  <text x="80" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#64748b">untuk siswa Indonesia</text>

  <!-- Feature pills -->
  <rect x="80" y="440" width="120" height="32" rx="16" fill="#312e6a" stroke="#4f46e5" stroke-width="1"/>
  <text x="140" y="461" font-family="system-ui, sans-serif" font-size="14" fill="#a5b4fc" text-anchor="middle">✓ Gratis</text>

  <rect x="212" y="440" width="132" height="32" rx="16" fill="#312e6a" stroke="#4f46e5" stroke-width="1"/>
  <text x="278" y="461" font-family="system-ui, sans-serif" font-size="14" fill="#a5b4fc" text-anchor="middle">✓ 5 Bahasa</text>

  <rect x="356" y="440" width="148" height="32" rx="16" fill="#312e6a" stroke="#4f46e5" stroke-width="1"/>
  <text x="430" y="461" font-family="system-ui, sans-serif" font-size="14" fill="#a5b4fc" text-anchor="middle">✓ Interaktif</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="610" width="1200" height="4" fill="url(#accent)"/>

  <!-- URL -->
  <text x="80" y="598" font-family="monospace" font-size="16" fill="#475569">disinauni.my.id</text>
</svg>
